[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensprite-sdk"
version = "0.1.0"
description = "Joint-space SDK for OpenSprite simulation and Jetson deployment"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
sim = ["mujoco==3.11.0", "imageio[ffmpeg]>=2.34", "Pillow>=10"]
deploy = ["onnxruntime>=1.20,<2"]
export = ["torch>=2.5", "onnx>=1.17"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opensprite_sdk = ["assets/**/*", "profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
